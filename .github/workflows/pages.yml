name: Publish maths library
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - run: npm test
      - run: npm run check
      - run: python3 scripts/check-static.py
      - name: Prepare verified same-origin IGCSE papers
        run: python3 scripts/prepare-igcse-pdfs.py
      - name: Install lightweight PDF text parser
        run: python3 -m pip install --user pypdf==6.1.1
      - name: Audit every IGCSE PDF page count and sampled document text
        run: python3 scripts/audit-igcse-content.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
