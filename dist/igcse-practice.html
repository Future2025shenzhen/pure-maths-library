<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IGCSE 原创完整大题 · Pure Practice</title>
<style>
:root{--ink:#243d35;--muted:#6c7c72;--line:#dfe7dd;--bg:#f6f7f2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.7 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{padding:20px max(18px,calc((100vw - 1040px)/2));background:#fff;border-bottom:1px solid var(--line)}header a{font:23px Georgia,serif;color:var(--ink);text-decoration:none}main{max-width:1040px;margin:0 auto;padding:32px 18px 90px}h1{font:clamp(28px,4vw,43px) Georgia,serif;margin:12px 0}h2{font-size:20px}p{color:var(--muted)}a{color:var(--ink)}button,select,input{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:10px 14px}button:hover{border-color:#829d87}.primary{background:var(--ink);color:#fff}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin:23px 0}.toolbar label{display:grid;gap:4px;font-size:12px;color:var(--muted)}select{min-width:160px;padding:10px;border:1px solid var(--line);border-radius:9px;background:#fff}.paper{background:white;border:1px solid var(--line);border-radius:12px;padding:clamp(18px,4vw,43px);margin-top:20px}.paper-top{display:flex;justify-content:space-between;gap:15px;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:13px;font-size:12px}.stem{white-space:pre-wrap;font-family:Georgia,"Times New Roman",serif;font-size:17px;line-height:1.9;color:#202b24;margin-top:24px}.answer{border-top:1px solid var(--line);margin-top:27px;padding-top:20px;white-space:pre-wrap;line-height:1.85}.answer code,.answer pre{display:block;white-space:pre-wrap;background:#eff3eb;padding:16px;border-radius:8px;overflow:auto}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.meta{font-size:12px;color:var(--muted)}.empty{padding:45px;text-align:center}.notice{border-left:3px solid #97ac85;padding:10px 16px;background:#eef2e9;margin:20px 0}#count{margin-left:auto;align-self:center}@media(max-width:600px){main{padding:24px 12px}header{padding:16px}.paper{padding:19px}.stem{font-size:15px}}
</style></head><body><header><a href="index.html">Pure Practice</a></header><main><a href="index.html">← 三科目录</a> · <a id="back" href="igcse.html?subject=physics">返回课程真题目录</a><h1 id="title">原创完整大题</h1><p>英文题干、中文逐步解析和模拟评分点。题目均为独立原创，不是剑桥官方真题；评分标准是学习用参考方案，非官方 MS。</p><div class="notice">题量透明：首批每科 3 道完整大题，不以少量占位题冒充完整题库。题目分值与方法经过内部逻辑校验，尚未经 Cambridge 官方审定。</div><div class="toolbar"><label>筛选知识点<select id="topic"><option value="">全部知识点</option></select></label><label>完成状态<select id="status"><option value="all">全部</option><option value="undone">未做</option><option value="done">已做</option><option value="saved">收藏</option></select></label><span id="count"></span></div><section id="question"></section></main>
<script type="module">
const params=new URLSearchParams(location.search),subject=params.get("subject")==="cs"?"cs":"physics";
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$("#title").textContent=(subject==="cs"?"Computer Science 0478":"Physics 0625")+" · 原创练习";
$("#back").href="igcse.html?subject="+subject;
let items=[],selection=[],pos=0,show=false;
const key="pure-practice-igcse-v1-"+subject;
let record={done:[],saved:[]};try{record=Object.assign(record,JSON.parse(localStorage.getItem(key))||{});}catch{}
function persist(){try{localStorage.setItem(key,JSON.stringify(record));}catch{alert("无法保存本地记录，检查浏览器存储设置。");}}
function reorder(){selection=items.filter(q=>(!$("#topic").value||q.topic===$("#topic").value)&&($("#status").value==="all"||$("#status").value==="done"&&record.done.includes(q.id)||$("#status").value==="undone"&&!record.done.includes(q.id)||$("#status").value==="saved"&&record.saved.includes(q.id)));selection=selection.map(q=>({q,random:Math.random()})).sort((a,b)=>a.random-b.random).map(x=>x.q);pos=0;show=false;render();}
function render(){let q=selection[pos];$("#count").textContent=selection.length+" 道匹配";if(!q){$("#question").innerHTML='<div class="paper empty">没有符合条件的题目，请更换筛选。</div>';return;}
$("#question").innerHTML='<article class="paper"><div class="paper-top"><span>'+esc(q.id)+' · '+esc(q.topic)+'</span><b>['+q.marks+' marks]</b></div><h2>'+esc(q.title)+'</h2><div class="stem">'+esc(q.stem)+'</div><div class="actions"><button class="primary" id="solution">'+(show?"隐藏答案和评分点":"查看答案和评分点")+'</button><button id="done">'+(record.done.includes(q.id)?"✓ 已做":"标记已做")+'</button><button id="saved">'+(record.saved.includes(q.id)?"★ 已收藏":"☆ 收藏")+'</button><button id="refresh">随机换题 ↻</button><button id="next">下一题 →</button><span class="meta">'+(pos+1)+' / '+selection.length+'</span></div>'+(show?'<div class="answer"><h2>中文解析 · 学习用参考评分</h2>'+esc(q.answer).replace(/\*\*(.*?)\*\*/g,"<strong>$1</strong>").replace(/\x60\x60\x60([\s\S]*?)\x60\x60\x60/g,"<pre>$1</pre>")+'</div>':"")+'</article>';
$("#solution").onclick=()=>{show=!show;render();};$("#done").onclick=()=>{record.done=record.done.includes(q.id)?record.done.filter(x=>x!==q.id):[...record.done,q.id];persist();render();};$("#saved").onclick=()=>{record.saved=record.saved.includes(q.id)?record.saved.filter(x=>x!==q.id):[...record.saved,q.id];persist();render();};$("#next").onclick=()=>{pos=(pos+1)%selection.length;show=false;render();};$("#refresh").onclick=()=>{if(selection.length===1){show=false;render();return;}const other=selection.filter(x=>x.id!==q.id);const chosen=other[Math.floor(Math.random()*other.length)];pos=selection.findIndex(x=>x.id===chosen.id);show=false;render();};
}
try{const r=await fetch("data/igcse-original.json");if(!r.ok)throw new Error(r.status);const d=await r.json();items=d.questions.filter(q=>q.subject===subject);for(const t of [...new Set(items.map(q=>q.topic))])$("#topic").add(new Option(t,t));$("#topic").onchange=reorder;$("#status").onchange=reorder;reorder();}catch(e){$("#question").innerHTML='<div class="paper empty">原创题库读取失败，请刷新页面。 '+esc(e.message)+'</div>';}
</script></body></html>
