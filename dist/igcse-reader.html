<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IGCSE PDF Reader · Pure Practice</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f7f2;color:#243d35;font:14px/1.7 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{padding:20px max(18px,calc((100vw - 1050px)/2));background:white;border-bottom:1px solid #dfe7dd}header a{font:22px Georgia,serif;text-decoration:none;color:#243d35}main{max-width:1050px;margin:auto;padding:25px 18px 60px}h1{font:clamp(25px,4vw,40px) Georgia,serif;margin:8px 0}p{color:#697a70}input{width:100%;border:1px solid #d4dfd5;background:#fff;border-radius:9px;padding:14px;font:inherit}button,.button{font:inherit;border:0;border-radius:9px;padding:12px 19px;background:#243d35;color:#fff;cursor:pointer;text-decoration:none;display:inline-block}.button.light{background:#e8eee6;color:#243d35}.actions{display:flex;flex-wrap:wrap;gap:9px;margin:14px 0}.frame{min-height:67vh;background:white;border:1px solid #dfe7dd;border-radius:13px;overflow:hidden}iframe{border:0;width:100%;height:74vh;display:block}.placeholder{padding:65px 25px;text-align:center;color:#667a6c}.notice{background:#e9efe4;border-left:3px solid #8fa884;padding:12px 16px;margin:17px 0}.small{font-size:12px}@media(max-width:600px){main{padding:20px 12px}iframe{height:68vh}}
</style></head><body><header><a href="index.html">Pure Practice</a></header><main><a id="back" href="igcse.html?subject=physics">← 返回课程目录</a><h1>真题 PDF 站内阅读器</h1><p>把来源网站上<strong>已确认存在的 PDF 文件网址</strong>粘贴到下方。阅读器不上传、不保存、不转载考试文件，只尝试在当前浏览器展示原站 PDF。</p><label for="url">原站 PDF 的 HTTPS 地址</label><input id="url" type="url" spellcheck="false" placeholder="https://来源网站/.../0625_s24_qp_41.pdf" autocomplete="off"><div class="actions"><button id="open">在页面中尝试打开</button><a id="new" class="button light" href="#" target="_blank" rel="noopener noreferrer" hidden>在原站新标签打开 ↗</a><button id="clear" class="button light">关闭</button></div><div class="notice"><strong>注意：</strong>部分第三方网站禁止嵌入（X-Frame-Options / CSP）或不支持 iPhone 的 iframe PDF 阅读。页面空白时请选择「在原站新标签打开」。只有读到实际 PDF 内容才能视为阅读成功。</div><div id="message" class="small" role="status"></div><div class="frame" id="frame"><div class="placeholder">输入已核对的 PDF 链接，开始阅读。</div></div><p class="small">版权归相关权利人所有。请使用具备访问权限的资料；此功能不绕过网站登录、访问限制或下载许可。</p></main><script>
const p=new URLSearchParams(location.search),subject=p.get('subject')==='cs'?'cs':'physics';
document.getElementById('back').href='igcse.html?subject='+subject;
const input=document.getElementById('url'),frame=document.getElementById('frame'),message=document.getElementById('message'),original=document.getElementById('new');
document.getElementById('open').onclick=()=>{
 let url;try{url=new URL(input.value.trim());if(url.protocol!=='https:'||!url.hostname||/\b(localhost|127\.0\.0\.1)\b/i.test(url.hostname))throw Error('只支持公网 HTTPS 链接');}catch{message.textContent='请输入完整、有效的公网 HTTPS PDF 链接。';return;}
 if(!/\.pdf(?:$|[?#])/i.test(url.href)){message.textContent='当前链接不是以 .pdf 结尾的直接文件地址，请先从来源目录打开 PDF 再复制实际文件地址。';return;}
 original.href=url.href;original.hidden=false;const iframe=document.createElement('iframe');iframe.setAttribute('title','Source-hosted PDF');iframe.setAttribute('referrerpolicy','no-referrer');iframe.src=url.href+'#toolbar=1';frame.replaceChildren(iframe);message.textContent='已请求打开原站文件，但嵌入不一定成功；如空白，请用新标签打开。';
};
document.getElementById('clear').onclick=()=>{frame.innerHTML='<div class="placeholder">已关闭阅读器。</div>';original.hidden=true;message.textContent='';};
</script></body></html>
