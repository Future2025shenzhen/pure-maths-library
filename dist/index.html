<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#243d35">
<title>Pure Practice · P1 / P2 / P3 数学题库</title>
<meta name="description" content="按阶段、章节和题型浏览原创 IAL Pure Mathematics 题目，查看完整答案、中文解析与评分细则。">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="assets/katex/katex.min.css"><link rel="stylesheet" href="style.css?v=9">
<script defer src="assets/katex/katex.min.js"></script><script defer src="assets/katex/contrib/auto-render.min.js"></script>
<script type="module" src="app.js?v=13"></script>
<link rel="stylesheet" href="account.css?v=5"><link rel="stylesheet" href="theme-minimal.css?v=12"><link rel="stylesheet" href="exam-paper.css?v=13">
</head>
<body>
<a class="skip" href="#content">跳到题目内容</a>
<header class="topbar"><a class="brand" href="#library" aria-label="Pure Practice 首页"><span>Pure Practice</span></a><nav aria-label="主导航"><button data-view="library" class="nav active">练习题</button><a class="nav-link" href="past.html">真题</a><button data-view="saved" class="nav">收藏 <span id="saved-count">0</span></button><button data-view="papers" class="nav">练习卷</button><button data-view="books" class="nav">教材</button></nav><button id="settings" class="text-button" aria-label="个人记录与备份" title="个人记录与备份">记录</button></header>
<div class="app-shell">
<aside id="sidebar" aria-label="题目筛选"><div class="aside-head"><span>筛选</span><button id="close-filters" class="icon-button mobile-only" aria-label="关闭筛选">×</button></div><h2>阶段与章节</h2><div id="stage-switch" class="stage-switch" role="group" aria-label="阶段"><button data-stage="P1">P1</button><button data-stage="P2">P2</button><button data-stage="P3" class="selected">P3</button></div><div class="chapter-heading"><h3>章节</h3><div><button id="all-chapters" class="text-button">全选</button><button id="clear-chapters" class="text-button">清空</button></div></div><div id="chapters"></div><label class="scope-toggle"><input type="checkbox" id="allow-cross-chapter">允许跨章节</label><label class="filter-label" for="kind">知识点</label><select id="kind"><option value="">全部题型</option></select><label class="filter-label" for="status">做题状态</label><select id="status"><option value="all">全部题目</option><option value="undone">未做</option><option value="done">已做</option></select><button id="reset" class="reset-button">重置筛选</button><button id="sidebar-book" class="text-button sidebar-book">打开教材 ↗</button><div class="local-note">收藏与已做记录保存在本机</div></aside>
<main id="content" tabindex="-1"><div id="main-view"><div class="loading">正在载入题库…</div></div></main>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="personal-dialog"><div class="dialog-head"><h2>个人记录</h2><button class="icon-button" data-close="personal-dialog" aria-label="关闭">×</button></div><p>收藏与已做状态保存在当前浏览器。没有账号或云端同步；清除浏览器数据会删除这些记录。</p><div id="personal-stats" class="personal-stats"></div><div class="button-row"><button id="export-state" class="primary">导出备份</button><label class="button secondary" for="import-file">导入备份</label><input type="file" id="import-file" accept="application/json,.json" hidden></div><p class="tiny">导入将合并有效题目 ID，不会清空现有记录。“已做”仅表示完成过，不代表答对。</p></dialog>
<dialog id="pdf-dialog"><div class="pdf-head"><strong id="pdf-title">教材</strong><a id="pdf-original" target="_blank" rel="noopener">原文件 ↗</a><button id="pdf-fullscreen" class="secondary">全屏阅读</button><button class="icon-button" data-close="pdf-dialog" aria-label="关闭教材">×</button></div><div class="pdf-toolbar"><button id="pdf-prev" class="secondary" aria-label="上一页">←</button><label>页码 <input type="number" id="pdf-page" min="1" value="1"></label><span id="pdf-total"></span><button id="pdf-next" class="secondary" aria-label="下一页">→</button><button id="pdf-out" class="secondary" aria-label="缩小">−</button><span id="pdf-zoom">适合宽度</span><button id="pdf-in" class="secondary" aria-label="放大">+</button></div><div id="pdf-scroll"><div id="pdf-message" role="status"></div><canvas id="pdf-canvas" aria-label="教材页面"></canvas></div></dialog>
<dialog id="report-dialog"><div class="dialog-head"><h2>资料与质量记录</h2><button class="icon-button" data-close="report-dialog" aria-label="关闭">×</button></div><div id="quality-content"></div></dialog>
</body></html>
