<div class="past-shell"><aside class="past-aside"><details id="past-filters" open><summary>筛选阶段、章节与年份</summary><div class="past-filter-fields"><h2>真题筛选</h2><label>阶段<select id="past-stage"><option>P1</option><option>P2</option><option>P3</option></select></label><label>年份<select id="past-year"><option value="">全部年份</option><option>2023</option><option>2022</option><option>2021</option><option>2020</option></select></label><label>考季<select id="past-month"><option value="">全部考季</option><option value="1">1月</option><option value="6">6月</option><option value="10">10月</option></select></label><div class="past-chapters"><div class="chapter-heading"><h3>章节</h3><div><button class="text-button" id="past-all">全选</button><button class="text-button" id="past-clear">清空</button></div></div><div id="past-chapter"></div><label class="scope-toggle"><input type="checkbox" id="past-cross-chapter">允许跨章节</label></div><label>记录<select id="past-record"><option value="all">全部题目</option><option value="saved">仅收藏</option><option value="undone">未做</option><option value="done">已做</option></select></label><button class="secondary" id="past-reset">重置筛选</button></div></details></aside>
